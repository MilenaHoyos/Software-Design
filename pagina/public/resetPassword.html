<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - Nueva contraseña</title>
    <link rel="stylesheet" href="loginDisenio.css">
    <link rel="stylesheet" href="portal.css">
</head>
<body class="auth-page-bg">
    <div class="auth-main-container">
        <div class="auth-panel-card">
            <p id="reset-aviso" class="aviso" hidden></p>
            <div class="auth-forms-container">
                <form id="form-reset" class="auth-form-content active-form">
                    <h2>Nueva contraseña</h2>
                    <p class="subtitle">Escribe la nueva contraseña para tu cuenta.</p>

                    <div class="form-input-group">
                        <label for="reset-password">Nueva contraseña</label>
                        <input type="password" id="reset-password" placeholder="Mínimo 10 caracteres" minlength="10" required>
                    </div>
                    <div class="form-input-group">
                        <label for="reset-password2">Repite la contraseña</label>
                        <input type="password" id="reset-password2" minlength="10" required>
                    </div>

                    <button type="submit" class="btn-panel-primary">Guardar contraseña</button>

                    <div class="form-actions-row center-content">
                        <a href="loginVentana.html" class="action-link">Volver al inicio de sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="resetApp.js"></script>
</body>
</html>
